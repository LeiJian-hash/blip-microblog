<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blip · 本地微动态</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">B</div>
        <div class="brand-text">
          <h1>Blip</h1>
          <p>本地微动态 · 数据只存在这台设备上</p>
        </div>
      </div>
      <div class="count-badge" id="postCount">0 条动态</div>
    </header>

    <main>
      <section class="composer" aria-label="发布动态">
        <div class="composer-avatar" id="composerAvatar" aria-hidden="true">我</div>
        <div class="composer-body">
          <label class="visually-hidden" for="authorInput">昵称</label>
          <input
            id="authorInput"
            class="author-input"
            type="text"
            maxlength="16"
            placeholder="你的昵称（可留空）"
            autocomplete="off"
          />
          <label class="visually-hidden" for="contentInput">动态内容</label>
          <textarea
            id="contentInput"
            class="content-input"
            maxlength="280"
            rows="3"
            placeholder="此刻想说点什么？"
          ></textarea>
          <div class="composer-footer">
            <span class="counter" id="counter">0 / 280</span>
            <button class="btn btn-primary" id="publishBtn" type="button">发布</button>
          </div>
        </div>
      </section>

      <p class="error" id="errorMsg" role="alert" hidden></p>

      <section class="timeline" aria-label="动态列表">
        <h2 class="timeline-title">最新动态</h2>
        <ul class="post-list" id="postList"></ul>
        <div class="empty-state" id="emptyState">
          <div class="empty-icon" aria-hidden="true">✎</div>
          <p class="empty-title">还没有任何动态</p>
          <p class="empty-hint">在上面写下第一句话，它会保存在本机的 Local Storage 里。</p>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <span>纯 HTML / CSS / JavaScript 实现</span>
      <button class="link-btn" id="clearAllBtn" type="button">清空全部数据</button>
    </footer>
  </div>

  <template id="postTemplate">
    <li class="post">
      <div class="post-avatar" data-field="avatar"></div>
      <div class="post-main">
        <div class="post-head">
          <span class="post-author" data-field="author"></span>
          <span class="post-time" data-field="time"></span>
          <button class="post-delete" type="button" data-action="delete" title="删除这条动态">删除</button>
        </div>
        <p class="post-content" data-field="content"></p>
      </div>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
